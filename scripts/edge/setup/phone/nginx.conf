worker_processes 1;
# Do NOT add "daemon off;" — termux-services (runit) supervises nginx
# and expects it to daemonize. Using daemon off causes double-start.

events {
    worker_connections 64;
}

http {
    include       /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 127.0.0.1:8000;
        server_name localhost;
        root /data/data/com.termux/files/home/flexiqueue/public;
        index index.php index.html;

        # Health check endpoint (Laravel's /up)
        location /up {
            try_files /up $uri /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_read_timeout 300;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\.ht {
            deny all;
        }

        # Static assets with long cache
        location /build/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}